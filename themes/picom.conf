
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.30;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;

inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 0.92;

corner-radius = 12;

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
